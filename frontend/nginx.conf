# nginx reverse-proxy for Flatland
# Serves Vite-built static files and proxies API/WS to the backend container.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for JSON/WS-ish text
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Static assets — long cache for hashed Vite chunks, no-cache for index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    client_max_body_size 16M;

    # Clean health URL — serves the static health page (same file as /health.html)
    location ~ ^/health/?$ {
        add_header Cache-Control "no-cache";
        try_files /health.html =404;
    }

    # WebSocket — must upgrade
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # No buffering for WS frames
        proxy_buffering off;
    }

    # Backend REST / docs / meta
    # Proxy everything the FastAPI app serves beyond the SPA
    location ~ ^/(api|healthz|wiki|guide|docs|redoc|openapi\.json|robots\.txt|sitemap\.xml) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Allow large history payloads
        proxy_buffering on;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
