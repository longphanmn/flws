services:
  backend:
    build:
      context: ${BACKEND_DIR:-./backend}
      dockerfile: Dockerfile
    image: flatland-backend:local
    container_name: flatland-backend
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV:-./.env}
        required: false
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Core world geometry / sim — override in .env as needed
      FLATWORLD_DB: /data/flatworld.db
      FLATWORLD_WIDTH: ${FLATWORLD_WIDTH:-400}
      FLATWORLD_HEIGHT: ${FLATWORLD_HEIGHT:-300}
      FLATWORLD_SEED: ${FLATWORLD_SEED:-42}
      FLATWORLD_TICK_RATE: ${FLATWORLD_TICK_RATE:-10}
      FLATWORLD_FOOD_COUNT: ${FLATWORLD_FOOD_COUNT:-380}
      FLATWORLD_CARRYING_CAPACITY: ${FLATWORLD_CARRYING_CAPACITY:-350}
      FLATWORLD_MAX_POPULATION: ${FLATWORLD_MAX_POPULATION:-420}
      FLATWORLD_PERCEIVE_RADIUS: ${FLATWORLD_PERCEIVE_RADIUS:-16}
      FLATWORLD_OMP_ENABLED: ${FLATWORLD_OMP_ENABLED:-true}
      FLATWORLD_OMP_THRESHOLD: ${FLATWORLD_OMP_THRESHOLD:-100}
      FLATWORLD_DATA_DIR: ${FLATWORLD_DATA_DIR:-/data}
      FLATWORLD_GOD_KEY: ${FLATWORLD_GOD_KEY:-}
      FLATWORLD_BOOTSTRAP_TOKEN: ${FLATWORLD_BOOTSTRAP_TOKEN:-}
      FLATWORLD_ALLOWED_ORIGINS: ${FLATWORLD_ALLOWED_ORIGINS:-}
      FLATWORLD_TRUSTED_PROXIES: ${FLATWORLD_TRUSTED_PROXIES:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - flatland-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flatland

  frontend:
    build:
      context: ${FRONTEND_DIR:-../flws-web}
      dockerfile: Dockerfile
    image: flatland-frontend:local
    container_name: flatland-frontend
    restart: unless-stopped
    env_file:
      - path: ${FRONTEND_ENV:-../flws-web/.env}
        required: false
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flatland

volumes:
  flatland-data:
    name: flatland-data

networks:
  flatland:
    name: flatland
